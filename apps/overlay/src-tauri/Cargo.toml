[package]
name = "wuwatcg-overlay"
version = "0.1.0"
description = "OBS overlay for Wuthering Waves: Versus match management"
authors = ["WuwaTCG Tools contributors"]
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "wuwatcg_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
