[package]
name = "wuwatcg-overlay"
version = "0.1.0"
description = "OBS overlay for Wuthering Waves: Versus match management"
authors = ["WuwaTCG Tools contributors"]
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "wuwatcg_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "net"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
