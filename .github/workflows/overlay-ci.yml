name: OBS overlay CI

on:
  pull_request:
    paths:
      - '.github/workflows/overlay-ci.yml'
      - 'apps/overlay/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/overlay-ci.yml'
      - 'apps/overlay/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm overlay:check

      - name: Run browser smoke test
        run: pnpm overlay:e2e

      - name: Check Rust formatting
        run: pnpm overlay:rust:format

      - name: Build frontend
        run: pnpm overlay:build

      - name: Lint Rust
        run: pnpm overlay:rust:check

      - name: Build Tauri application
        run: pnpm overlay:tauri:check
