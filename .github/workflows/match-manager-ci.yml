name: Match manager CI

on:
  pull_request:
    paths:
      - '.github/workflows/match-manager-ci.yml'
      - 'apps/match-manager/**'
      - 'apps/match-manager-web/**'
      - 'packages/match-ui/**'
      - 'scripts/build-match-wasm.mjs'
      - 'crates/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-manager-ci.yml'
      - 'apps/match-manager/**'
      - 'apps/match-manager-web/**'
      - 'packages/match-ui/**'
      - 'scripts/build-match-wasm.mjs'
      - 'crates/**'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Wasm tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked --root .tools/wasm-pack

      - name: Check frontend
        run: |
          pnpm match-ui:check
          pnpm match-manager:check

      - name: Run browser smoke test
        run: pnpm match-manager:e2e

      - name: Check Rust formatting
        run: pnpm match-manager:rust:format

      - name: Check shared core
        run: |
          pnpm match-core:format
          pnpm match-core:check
          pnpm match-core:test

      - name: Build frontend
        run: pnpm match-manager:build

      - name: Lint Rust
        run: pnpm match-manager:rust:check

      - name: Test Desktop persistence and API
        run: pnpm match-manager:rust:test

      - name: Check Web and Desktop parity
        run: |
          pnpm match-manager-web:check
          pnpm match-manager-web:e2e
          pnpm match-manager-web:preview:test

      - name: Build Tauri application
        run: pnpm match-manager:tauri:check
