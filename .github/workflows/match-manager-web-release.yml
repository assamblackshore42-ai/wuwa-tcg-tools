name: Match manager Web release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-manager-web-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Wasm tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked --root .tools/wasm-pack

      - name: Check shared core
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm match-core:format
          pnpm match-core:check
          pnpm match-core:test

      - name: Check shared UI and Web
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm match-ui:check
          pnpm match-manager-web:check

      - name: Test Web persistence
        run: pnpm match-manager-web:e2e

      - name: Build and test release assets
        run: pnpm match-manager-web:preview:test

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
          }

      - name: Deploy to Cloudflare Workers Static Assets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          packageManager: npm
          command: deploy --config wrangler.jsonc

      - name: Write release summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          '### Match Manager Web released' >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Ref: $env:GITHUB_REF_NAME" >> $env:GITHUB_STEP_SUMMARY
          if (-not [string]::IsNullOrWhiteSpace($env:DEPLOYMENT_URL)) {
            "URL: $env:DEPLOYMENT_URL" >> $env:GITHUB_STEP_SUMMARY
          }
