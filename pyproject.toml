[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wuwatcg-assistant"
version = "0.1.0"
description = "Windows desktop card recognition assistant for Wuthering Waves: Versus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "opencv-contrib-python-headless>=4.11,<5",
  "PySide6>=6.9,<7",
]

[project.scripts]
wuwatcg-assistant = "wuwatcg_assistant.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wuwatcg_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wuwatcg_assistant"]

