[package]
name = "match-core-wasm"
version = "0.1.0"
description = "Browser JSON bindings for the shared match core"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
match-core = { path = "../match-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "=0.2.129"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
